<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#090B10"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" stroke="#27272A" stroke-width="1.5"/>
  <!-- Tres arcos superiores icónicos de El Cairo -->
  <path d="M 35 28 A 12 10 0 0 1 56 28" stroke="#FACC15" stroke-width="4.2" stroke-linecap="round" fill="none"/>
  <path d="M 22 28 A 13 10.5 0 0 1 45 28" stroke="#F97316" stroke-width="4.2" stroke-linecap="round" fill="none"/>
  <path d="M 8 28 A 14 11 0 0 1 33 28" stroke="#DC2626" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <!-- Inscripción EL CAIRO -->
  <text x="32" y="44" text-anchor="middle" fill="#DC2626" font-family="Arial Black, Inter, sans-serif" font-weight="900" font-style="italic" font-size="11.5" letter-spacing="0.4">EL CAIRO</text>
  <!-- Línea inferior degradada -->
  <rect x="10" y="50" width="44" height="3" rx="1.5" fill="url(#cairoGrad)"/>
  <defs>
    <linearGradient id="cairoGrad" x1="10" y1="50" x2="54" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
  </defs>
</svg>

